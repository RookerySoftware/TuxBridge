[package]
name = "tuxbridge"
version = "0.1.0"
license = "Apache-2.0"
description = "Linux on Windows, made easy"
authors = ["Rookery Software"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tuxbridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56.0"
anyhow = "1.0.104"
thiserror = "2.0.21"
sha2 = "0.11.1"
hex = "0.4.3"
dirs = "7.0.0"
tokio = { version = "1.54.1", features = ["process", "time", "fs", "io-util", "macros", "rt-multi-thread", "sync"] }
futures-util = "0.3.34"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_JobObjects"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "multipart"] }
rcgen = "0.14.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

