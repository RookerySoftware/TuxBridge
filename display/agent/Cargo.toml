[package]
name = "easywsl-agent"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
description = "Runs inside Linux: hands the desktop to the TuxBridge viewer and its input to the desktop"

[dependencies]
easywsl-protocol = { path = "../protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking-api"] }
pipewire = "0.8"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = "0.8"
x11rb = { version = "0.13", features = ["damage", "xfixes", "xtest"] }
libc = "0.2"
